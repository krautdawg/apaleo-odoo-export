# Konfiguration für apaleo-abacus-export
#
# Kopiere diese Datei nach apaleo-abacus.config.yaml und bearbeite sie. Das Tool
# sucht die Datei aus --config, sonst aus APALEO_ABACUS_CONFIG, sonst
# ./apaleo-abacus.config.yaml. JSON geht auch, wenn der Dateiname auf .json endet.
#
# Secrets kommen nie in diese Datei. Setze sie in der Umgebung (zum Beispiel in .env):
#   APALEO_CLIENT_SECRET   das Client-Secret deiner apaleo Custom App
#
# Diese Einstellungen lassen sich auch aus der Umgebung setzen (nur einzelne Werte):
#   APALEO_ABACUS_OUTPUT_DIR   -> output.dir
#   APALEO_CLIENT_ID        -> apaleo.clientId
#   APALEO_ABACUS_TIMEZONE     -> schedule.timezone

apaleo:
  # Client-ID der Custom App, die du unter Apps > Connected apps angelegt hast.
  # Trag sie hier ein oder setze APALEO_CLIENT_ID. Erforderliche Berechtigungen:
  # siehe docs/setup-apaleo.md.
  clientId:
  # Nur für Clients, die Scopes statt Berechtigungen nutzen, zum Beispiel:
  # scopes: accounting.read
  # Ändere diese Werte nur, um gegen eine andere apaleo-Umgebung zu testen. Sie
  # müssen https sein (einfaches http nur für localhost):
  # baseUrl: https://api.apaleo.com
  # identityUrl: https://identity.apaleo.com

# Was der Abacus-Mandant deines Treuhänders festlegt. Frag deinen Treuhänder.
# Siehe docs/configuration.md und docs/abacus-format.md.
abacus:
  # Die Mandantennummer in Abacus, 1 bis 6 Ziffern. Ohne Standardwert.
  mandant: 1234
  # Die Leitwährung des Mandanten: CHF (Standard) oder EUR. Jedes Hotel muss
  # in dieser Währung buchen, das Tool rechnet nicht um.
  leitwaehrung: CHF
  # Die MWST-Abrechnungsart: vereinbart (Standard) oder vereinnahmt.
  abrechnungsart: vereinbart
  # Die Version der AbaConnect-Schnittstelle: "2015.00" (Standard), "2020.00",
  # "2022.00" oder "2024.00". Nur ändern, wenn Abacus die Datei ablehnt.
  version: "2015.00"
  # Steuerkonto und Hilfskonto der MWST-Codes, wie im KMU-Mustermandanten.
  mwstKonto: 2200
  mwstHilfskonto: 2202
  # Die MWST-Codes aus der MWST-Tabelle des Mandanten. init-mapping schreibt sie
  # in die Kontenzuordnung, mapping check prüft sie.
  mwstCodes:
    normal: 311        # Normalsatz 8,1 %
    reduziert: 312     # reduzierter Satz 2,6 %
    beherbergung: 313  # Sondersatz Beherbergung 3,8 %
  # Der Geschäftsbereich, 0 ohne Geschäftsbereiche. Bucht dein Treuhänder zwei
  # Hotels in denselben Mandanten, gib jedem einen eigenen Geschäftsbereich
  # (properties[].geschaeftsbereich), sonst warnt das Tool mit W-MANDANT-SHARED.
  geschaeftsbereich: 0

posting:
  # Was in Text2 jeder Buchung steht: "receipt" nimmt den Beleg aus apaleo
  # (Rechnung, Zahlungsreferenz) und sonst die Reservationsreferenz;
  # "reference" nimmt immer die Reservationsreferenz. Nie ein Gastname.
  text2: receipt

output:
  # Ordner für die erzeugten Abacus-Dateien, relativ zum Arbeitsverzeichnis.
  dir: ./exports

# Die apaleo-Hotels, mit denen das Tool arbeitet, jedes mit seiner Kontenzuordnung
# (CSV, relativ zum Arbeitsverzeichnis; Standard ./mapping-<id>.csv). Leg die
# Kontenzuordnung mit "apaleo-abacus init-mapping --property BSP --template kmu-hotel" an
# und lass sie von deinem Treuhänder prüfen. Die IDs listet "apaleo-abacus properties".
# "apaleo-abacus export --month 2026-10" exportiert jedes hier eingetragene Hotel.
# Bucht dein Treuhänder zwei Hotels in einen Mandanten, braucht jedes einen eigenen
# Geschäftsbereich, sonst können sich die Belegnummern wiederholen (W-MANDANT-SHARED).
# properties:
#   - id: BSP
#     mapping: ./mapping-BSP.csv
#   - id: BSP2
#     mapping: ./mapping-BSP2.csv
#     geschaeftsbereich: 2

checks:
  # Vergleicht das Buchungsjournal zusätzlich mit den Tagessummen von apaleo pro
  # Hauptkonto und warnt bei Abweichungen (W-AGGREGATE-DIFF). Standardmässig aus:
  # Es braucht die optionale Berechtigung core.subledger_aggregate.create und
  # eine zusätzliche Anfrage pro Tag.
  aggregates: false

# "apaleo-abacus schedule --once" exportiert jeden fälligen Zeitraum, der noch nicht
# im Ausgabeordner liegt, und endet. Starte es per Cron oder mit der Docker-Compose-
# Schleife (docs/docker.md); stündlich ist unbedenklich.
schedule:
  # "Heute" ist das Datum in dieser IANA-Zeitzone (Standard Europe/Zurich).
  # Auch APALEO_ABACUS_TIMEZONE.
  timezone: Europe/Zurich
  # Ein Rhythmus pro Installation, damit nie tägliche und monatliche Dateien bei
  # Abacus ankommen: "monthly" (eine Importdatei pro Monat für den Treuhänder) oder "daily"
  # (etwa 30 Importe im Monat).
  cadence: monthly
  monthly:
    # Ein Monat ist ab diesem Tag des Folgemonats fällig (1 bis 5). Bei 1 oder 2
    # wartet er bis zum 2. um 06:00 Uhr (siehe finalAfter).
    dayOfMonth: 3
  daily:
    # Ein Tag ist so viele Tage später fällig (1 bis 3); 2 = vorgestern.
    # Bei 1 wird gestern als "not yet final" gemeldet und später exportiert.
    offsetDays: 2
  # apaleo kann auf einen Tag noch buchen, bis der Tagesabschluss (Night Audit)
  # den folgenden Tag schliesst, und der läuft nach Mitternacht. Ein Zeitraum, der
  # am Tag T endet, ist deshalb ab dieser Ortszeit am Tag T+2 abgeschlossen und
  # wird dann exportiert ("00:00" bis "12:00", in Anführungszeichen). Bis dahin
  # meldet das Tool ihn als "not yet final". Setze den Wert auf die Uhrzeit, zu
  # der dein Tagesabschluss fertig ist.
  finalAfter: "06:00"
  # Wie viele Tage zurück ein verpasster Zeitraum nach einem Ausfall noch exportiert
  # wird (mindestens 3 bei monatlich, 5 bei täglich). Beim ersten Lauf wird jeder
  # Zeitraum exportiert, der in diesem Fenster fällig ist: Setze den Wert für den
  # ersten Lauf niedriger, wenn ein früheres Tool diese Monate schon geliefert hat.
  catchUpDays: 40
