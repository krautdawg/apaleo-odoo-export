# Konfiguration von "apaleo-odoo export --demo". Die Demo liest nur diese
# Datei, nie deine eigene Konfiguration oder Umgebung. Das Hotel ist erfunden:
# importiere eine Demo-Datei nie in ein echtes Odoo-Unternehmen.
odoo:
  # Das Kürzel des Journals in Odoo, in das die Buchungssätze gehen würden.
  journal: APA
  # Eine neue Datenbank in Odoo Online ist Odoo 19 mit SKR03 und rundet die
  # Steuer pro Steuer (per_tax).
  version: 19
  taxRounding: per_tax
  # SKR03 2700 (Sonstige Erträge), ohne Steuer: für den Cent, den die Rundung
  # pro Steuer nicht erreicht. Welches Konto, entscheidet deine Kanzlei.
  roundingAccount: "2700"
properties:
  - id: BSP
    # Relativ zu diesem Ordner (examples/demo/).
    mapping: mapping-BSP.csv
