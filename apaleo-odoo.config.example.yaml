# Konfiguration für apaleo-odoo-export
#
# Kopiere diese Datei nach apaleo-odoo.config.yaml und bearbeite sie. Das Tool
# sucht die Datei aus --config, sonst aus APALEO_ODOO_CONFIG, sonst
# ./apaleo-odoo.config.yaml. JSON geht auch, wenn der Dateiname auf .json endet.
#
# Secrets kommen nie in diese Datei. Setze sie in der Umgebung (zum Beispiel in .env):
#   APALEO_CLIENT_SECRET   das Client-Secret deiner apaleo Custom App
#
# Diese Einstellungen lassen sich auch aus der Umgebung setzen (nur einzelne Werte):
#   APALEO_ODOO_OUTPUT_DIR   -> output.dir
#   APALEO_CLIENT_ID        -> apaleo.clientId
#   APALEO_ODOO_TIMEZONE     -> schedule.timezone

apaleo:
  # Client-ID der Custom App, die du unter Apps > Connected apps angelegt hast.
  # Trag sie hier ein oder setze APALEO_CLIENT_ID. Erforderliche Berechtigungen:
  # siehe docs/setup-apaleo.md.
  clientId:
  # Nur für Clients, die Scopes statt Berechtigungen nutzen, zum Beispiel:
  # scopes: accounting.read
  # Ändere diese Werte nur, um gegen eine andere apaleo-Umgebung zu testen. Sie
  # müssen https sein (einfaches http nur für localhost):
  # baseUrl: https://api.apaleo.com
  # identityUrl: https://identity.apaleo.com

# Odoo: wohin die Buchungssätze in Odoo gehen. Was jeder Wert in der
# Importdatei bewirkt, steht in docs/odoo-format.md und docs/configuration.md.
odoo:
  # Das Kürzel des Journals (Typ „Sonstige“), in das die Buchungssätze
  # importiert werden: 1 bis 5 Zeichen A-Z und 0-9. Ohne Standardwert.
  journal: APA
  # Die Odoo-Version der Datenbank: 17, 18 oder 19. Ohne Standardwert. Sie
  # bestimmt die Rundungsmethode ohne Angabe und die Codes von Kasse und
  # Geldtransit, die init-mapping einträgt.
  version: 18
  # Die Datenbank-ID des Unternehmens, dem die Steuern gehören (bei einer
  # Niederlassung das Hauptunternehmen). Standard 1.
  companyId: 1
  # Die Währung des Unternehmens: EUR (Standard) oder CHF. Jedes Hotel muss
  # in dieser Währung buchen, das Tool rechnet nicht um.
  currency: EUR
  # Die Rundungsmethode des Unternehmens (Einstellungen > Buchhaltung >
  # Steuern > Rundungsmethode): per_line oder per_tax. Standard: per_line
  # für Odoo 17 und 18, per_tax für Odoo 19. Muss zu Odoo passen.
  # taxRounding: per_line
  # Ein Konto ohne Steuer für den Rundungscent bei per_tax, zum Beispiel
  # "2700". Mit per_tax Pflicht.
  # roundingAccount: "2700"

posting:
  # Was das Protokoll zu jeder apaleo-Zeile nennt (nie die Importdatei):
  # "receipt" nimmt den Beleg aus apaleo (Rechnung, Zahlungsreferenz) und sonst
  # die Referenz der Reservierung; "reference" nimmt immer die Referenz. Nie
  # ein Gastname.
  text2: receipt

output:
  # Ordner für die erzeugten Odoo-Importdateien, relativ zum Arbeitsverzeichnis.
  dir: ./exports

# Die apaleo-Hotels, mit denen das Tool arbeitet, jedes mit seiner Kontenzuordnung
# (CSV, relativ zum Arbeitsverzeichnis; Standard ./mapping-<id>.csv). Leg die
# Kontenzuordnung mit "apaleo-odoo init-mapping --property BSP --template skr03-hotel"
# (oder skr04-hotel) an und lass sie von deinem Steuerberater prüfen. Die IDs listet
# "apaleo-odoo properties". "apaleo-odoo export --month 2026-10" exportiert jedes hier
# eingetragene Hotel. Ein Hotel kann ein eigenes Journal haben (journal).
# properties:
#   - id: BSP
#     mapping: ./mapping-BSP.csv
#   - id: BSP2
#     mapping: ./mapping-BSP2.csv
#     journal: APB

checks:
  # Vergleicht das Buchungsjournal zusätzlich mit den Tagessummen von apaleo pro
  # Hauptkonto und warnt bei Abweichungen (W-AGGREGATE-DIFF). Standardmässig aus:
  # Es braucht die optionale Berechtigung core.subledger_aggregate.create und
  # eine zusätzliche Anfrage pro Tag.
  aggregates: false

# "apaleo-odoo schedule --once" exportiert jeden fälligen Zeitraum, der noch nicht
# im Ausgabeordner liegt, und endet. Starte es per Cron oder mit der Docker-Compose-
# Schleife (docs/docker.md); stündlich ist unbedenklich.
schedule:
  # "Heute" ist das Datum in dieser IANA-Zeitzone (Standard Europe/Zurich).
  # Auch APALEO_ODOO_TIMEZONE.
  timezone: Europe/Zurich
  # Ein Rhythmus pro Installation, damit nie tägliche und monatliche Dateien bei
  # Odoo ankommen: "monthly" (eine Importdatei pro Monat für die Kanzlei) oder "daily"
  # (etwa 30 Importe im Monat).
  cadence: monthly
  monthly:
    # Ein Monat ist ab diesem Tag des Folgemonats fällig (1 bis 5). Bei 1 oder 2
    # wartet er bis zum 2. um 06:00 Uhr (siehe finalAfter).
    dayOfMonth: 3
  daily:
    # Ein Tag ist so viele Tage später fällig (1 bis 3); 2 = vorgestern.
    # Bei 1 wird gestern als "not yet final" gemeldet und später exportiert.
    offsetDays: 2
  # apaleo kann auf einen Tag noch buchen, bis der Tagesabschluss (Night Audit)
  # den folgenden Tag schliesst, und der läuft nach Mitternacht. Ein Zeitraum, der
  # am Tag T endet, ist deshalb ab dieser Ortszeit am Tag T+2 abgeschlossen und
  # wird dann exportiert ("00:00" bis "12:00", in Anführungszeichen). Bis dahin
  # meldet das Tool ihn als "not yet final". Setze den Wert auf die Uhrzeit, zu
  # der dein Tagesabschluss fertig ist.
  finalAfter: "06:00"
  # Wie viele Tage zurück ein verpasster Zeitraum nach einem Ausfall noch exportiert
  # wird (mindestens 3 bei monatlich, 5 bei täglich). Beim ersten Lauf wird jeder
  # Zeitraum exportiert, der in diesem Fenster fällig ist: Setze den Wert für den
  # ersten Lauf niedriger, wenn ein früheres Tool diese Monate schon geliefert hat.
  catchUpDays: 40
