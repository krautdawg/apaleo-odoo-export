# apaleo-abacus-export mit Docker Compose. Siehe docs/docker.md.
#
#   cp .env.example .env            # dann APALEO_CLIENT_SECRET eintragen
#   mkdir -p config data            # config/apaleo-abacus.config.yaml und config/mapping-<id>.csv kommen nach ./config
#   sudo chown 1000:1000 data       # der Container läuft als Benutzer node (uid 1000)
#   docker compose -f docker-compose.example.yml up -d --build
#
# Das Image wird hier aus dem Quellcode gebaut (build: .); es gibt kein Image in
# einer Registry. Die Schleife ruft stündlich "schedule --once" auf: Es exportiert,
# was fällig ist, und überspringt, was schon in ./data liegt. Häufige Aufrufe
# kosten also nichts. Die Abacus-Dateien für deinen Treuhänder liegen danach in
# ./data/<Hotel>/<JJJJ-MM>/.
#
# Mit Argumenten führt der Dienst stattdessen genau diesen einen Befehl aus und
# endet, zum Beispiel aus Cron auf dem Host oder für einen einmaligen Export:
#   docker compose -f docker-compose.example.yml run --rm apaleo-abacus schedule --once
#   docker compose -f docker-compose.example.yml run --rm apaleo-abacus export --month 2026-10

services:
  apaleo-abacus:
    build: .
    image: apaleo-abacus-export:local
    restart: unless-stopped
    # tini als PID 1, damit "docker compose down" das sleep sofort beendet.
    init: true
    env_file: .env
    # "Heute" für den Zeitplan ist das Datum in dieser Zeitzone. Europe/Zurich ist
    # der Standard; setz den Wert nur, wenn deine Hotels woanders stehen.
    # environment:
    #   APALEO_ABACUS_TIMEZONE: Europe/Zurich
    volumes:
      - ./config:/config:ro
      - ./data:/data
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$#" -gt 0 ]; then exec node /app/dist/cli/main.js "$$@"; fi
        while true; do
          node /app/dist/cli/main.js schedule --once
          sleep 3600
        done
      - apaleo-abacus
