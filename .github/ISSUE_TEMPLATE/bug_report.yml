name: Fehlerbericht
description: Etwas funktioniert nicht so, wie die Dokumentation sagt.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Meldung. **Füge nie Secrets oder Gästedaten ein.** Entferne vor dem Absenden das apaleo-Client-Secret
        und Tokens, API-Schlüssel und Adressen deiner Odoo-Datenbank, Gästenamen, E-Mail-Adressen, Reservierungs- und
        Rechnungsnummern, echte Steuernummern oder USt-IdNr. und Kontensalden. Kontonummern aus SKR03 oder SKR04 und die
        IDs der Odoo-Steuern (zum Beispiel tax_ust_7_skr03) darfst du stehen lassen.
        Sicherheitsprobleme gehören nicht hierher, sondern in ein privates Security Advisory (siehe SECURITY.md).

        Meldungen auf Englisch sind ebenfalls willkommen.
  - type: input
    id: version
    attributes:
      label: Version des Tools und von Odoo
      description: Die Ausgabe von `apaleo-odoo --version` (oder `node dist/cli/main.js --version`), der Commit, falls du ihn kennst, und deine Odoo-Version und Edition (17, 18 oder 19; Community oder Enterprise; Odoo Online, Odoo.sh oder selbst gehostet) mit dem Kontenrahmen.
      placeholder: 0.1.0, Commit abc1234; Odoo 18 Enterprise auf Odoo.sh, SKR03
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Wie startest du es?
      options:
        - Aus dem Quellcode (node dist/cli/main.js)
        - Docker-Compose-Beispiel
        - Einfaches docker run
        - Anders
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Befehl
      description: Der genaue Befehl, den du ausgeführt hast, mit allen Optionen.
      render: sh
      placeholder: apaleo-odoo export --month 2026-10 --dry-run
    validations:
      required: true
  - type: input
    id: findings
    attributes:
      label: Befund-Codes
      description: Jeder Code, den das Tool ausgegeben hat, zum Beispiel E-UNMAPPED, W-FOOD-RATE. Siehe docs/troubleshooting.md.
      placeholder: E-VAT-RATE, W-RECENT-DAY
  - type: textarea
    id: expected
    attributes:
      label: Was ist passiert, und was hast du erwartet?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Anonymisierte Ausgabe
      description: Die Ausgabe oder der passende Teil des Protokolls, mit ersetzten Namen, Nummern und Beträgen.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Vor dem Absenden
      options:
        - label: Ich habe jedes Secret, jedes Token und alle Gästedaten aus dieser Meldung entfernt.
          required: true
