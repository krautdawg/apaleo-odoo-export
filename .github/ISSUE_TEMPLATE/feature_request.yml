name: Funktionswunsch
description: Schlag eine Verbesserung für den bestehenden Export von apaleo nach Odoo vor.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Schau bitte zuerst in „Was es nicht macht“ im README und in „Später geplant“ in docs/maintainers.md.
        Ein neues PMS oder Zielformat hat ein eigenes Formular. Füge nie Secrets oder Gästedaten ein.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Was brauchst du, dein Backoffice oder deine Kanzlei in Odoo, das das Tool heute nicht kann?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorschlag
      description: Wie könnte das Tool es lösen? Befehle, Konfigurationsschlüssel, ein Beispiel für den Buchungssatz in Odoo (Sachkonto, Gegenkonto, Odoo-Steuer, Betrag), den du erwartest.
  - type: textarea
    id: accounting
    attributes:
      label: Buchhalterischer Hintergrund
      description: Wenn sich Buchungen ändern, was sagt dein Steuerberater dazu? Welcher Kontenrahmen (SKR03, SKR04 oder ein eigener), welche Sachkonten und Steuern, welche Kennzahl der UStVA, Soll- oder Ist-Versteuerung?
  - type: checkboxes
    id: help
    attributes:
      label: Mitarbeit
      options:
        - label: Ich würde gern bei der Umsetzung helfen (siehe CONTRIBUTING.md).
