name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: CLI smoke test
        run: node dist/cli/main.js --help

  readme-quickstart:
    name: README quick start (install from source, help, demo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from the README's own `corepack enable`, so there is no pnpm yet to cache with.
          package-manager-cache: false
      - name: Extract the install block from the README
        # The first sh block after <!-- quickstart -->, without the clone: the checkout is the clone.
        run: |
          awk '/<!-- quickstart -->/ { found = 1; next }
               found && /^[[:space:]]*```sh/ { inblock = 1; next }
               inblock && /^[[:space:]]*```/ { exit }
               inblock { sub(/^[[:space:]]+/, ""); print }' README.md \
            | grep -v -e '^git clone ' -e '^cd apaleo-abacus-export$' > "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"
          grep -qx 'pnpm install --frozen-lockfile' "$RUNNER_TEMP/quickstart.sh"
          grep -q '^node dist/cli/main.js --help' "$RUNNER_TEMP/quickstart.sh"
      - name: Run the README install commands verbatim
        run: bash -euxo pipefail "$RUNNER_TEMP/quickstart.sh"
      - name: Help names the apaleo-abacus binary
        run: |
          node dist/cli/main.js --help > "$RUNNER_TEMP/help.txt"
          grep -qxF 'Usage: apaleo-abacus <command> [options]' "$RUNNER_TEMP/help.txt"
      - name: Demo dry run without config, secret or network prints the Swiss Abacus summary in CHF
        run: |
          node dist/cli/main.js export --month 2026-09 --demo --dry-run | tee "$RUNNER_TEMP/demo.txt"
          grep -q '^Import into Abacus FIBU' "$RUNNER_TEMP/demo.txt"
          grep -q '^  Mandant: 7777, Geschäftsbereich 0, Leitwährung CHF$' "$RUNNER_TEMP/demo.txt"
          grep -q '^Totals per Abacus account' "$RUNNER_TEMP/demo.txt"
          grep -q '^  313 3.8 % (Ziffer 343): net ' "$RUNNER_TEMP/demo.txt"
          grep -q '^DEMO Result: dry run, nothing written; 1 file(s) passed every check.' "$RUNNER_TEMP/demo.txt"

  docker:
    name: docker image (build and run, never pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t apaleo-abacus-export:ci .
      - run: docker run --rm apaleo-abacus-export:ci --help
      - run: docker run --rm apaleo-abacus-export:ci --version
      - run: docker run --rm apaleo-abacus-export:ci export --month 2026-09 --demo --dry-run
      - name: Real demo run with a /data volume, as in docs/docker.md
        run: |
          mkdir -p "$RUNNER_TEMP/demo-data"
          sudo chown 1000:1000 "$RUNNER_TEMP/demo-data"
          docker run --rm -w /data -v "$RUNNER_TEMP/demo-data:/data" apaleo-abacus-export:ci export --month 2026-09 --demo
          test -s "$RUNNER_TEMP/demo-data/demo-output/BSP/2026-09/ABACUS_Buchungen_20260901-20260930_BSP_DEMO.xml"
          test -s "$RUNNER_TEMP/demo-data/demo-output/BSP/2026-09/manifest.json"
      - name: Demo without a writable working directory names the fix
        run: |
          set +e
          out="$(docker run --rm apaleo-abacus-export:ci export --month 2026-09 --demo 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          grep -q -- '-w /data' <<<"$out"
      - name: OCI labels name apaleo, Abacus and the MIT licence
        run: |
          label() { docker inspect -f "{{ index .Config.Labels \"org.opencontainers.image.$1\" }}" apaleo-abacus-export:ci; }
          test "$(label title)" = apaleo-abacus-export
          test "$(label licenses)" = MIT
          test "$(label source)" = https://github.com/krautdawg/apaleo-abacus-export
          label description | grep -q 'apaleo'
          label description | grep -q 'Abacus'
          if label description | grep -q 'BMD'; then exit 1; fi
      - name: Runs as user node
        run: test "$(docker run --rm --entrypoint id apaleo-abacus-export:ci -un)" = node
      - name: schedule without --once exits 2
        run: |
          set +e
          docker run --rm apaleo-abacus-export:ci schedule
          test $? -eq 2
